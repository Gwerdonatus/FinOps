services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
      POSTGRES_DB: finops_console
    ports:
      - "5432:5432"
    volumes:
      - finops_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  finops_db_data:
